<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITI EV — 3D Purple MCQs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0b0a1a;
      background-image: radial-gradient(circle at 15% 30%, #2e1b4e 0%, #0b0a1a 70%);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ede9fe;
    }

    /* main glass container */
    .app-wrapper {
      max-width: 1100px;
      width: 100%;
    }

    /* HEADER — floating 3D effect */
    .header {
      text-align: center;
      padding: 32px 20px;
      background: linear-gradient(145deg, #1e1535, #0f0b1f);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 
        0 25px 40px -12px #00000080,
        inset 0 1px 3px #ffffff1a,
        0 0 0 1px #6b21a880;
      margin-bottom: 36px;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, #a855f740, transparent 70%);
      pointer-events: none;
    }

    .header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0e7ff, #c4a5ff, #b07cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px #a855f760;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1rem;
      color: #baa7e6;
      background: #2a1b44b0;
      display: inline-block;
      padding: 8px 26px;
      border-radius: 100px;
      backdrop-filter: blur(6px);
      box-shadow: inset 0 1px 2px #ffffff1a, 0 8px 18px -8px #000000;
      font-weight: 500;
    }

    /* set buttons — unique pill / hover 3D */
    .set-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .set-btn {
      flex: 1;
      min-width: 150px;
      padding: 18px 18px;
      border: none;
      border-radius: 60px;
      background: #18122b;
      box-shadow: 
        0 12px 22px -10px #000000b0,
        inset 0 1px 0 #ffffff1a,
        0 0 0 1px #3f2e66;
      color: #b9a6f0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
      position: relative;
    }

    .set-btn:hover {
      transform: translateY(-6px) scale(1.02);
      background: #241b3d;
      box-shadow: 
        0 24px 32px -12px #a855f780,
        inset 0 1px 0 #ffffff2a,
        0 0 0 1px #a78bfa;
      color: #f0e7ff;
    }

    .set-btn.active {
      background: linear-gradient(145deg, #7e22ce, #a855f7);
      color: white;
      box-shadow: 
        0 0 0 2px #c084fc,
        0 18px 30px -10px #a855f7b0,
        inset 0 1px 6px #ffffff80;
      transform: scale(1.02);
    }

    /* search */
    .search-wrap {
      margin-bottom: 32px;
      display: flex;
      justify-content: center;
      padding: 0 6px;
    }

    .search-wrap input {
      width: 100%;
      max-width: 600px;
      padding: 16px 28px;
      border-radius: 60px;
      border: none;
      background: #130f22;
      box-shadow: 
        inset 0 6px 10px #00000080,
        0 0 0 1px #3e2d60,
        0 8px 18px -10px #000000;
      color: #eee6ff;
      font-size: 1rem;
      font-weight: 400;
      outline: none;
      caret-color: #c084fc;
    }

    .search-wrap input::placeholder {
      color: #8b7aa8;
      font-weight: 400;
    }

    .search-wrap input:focus {
      box-shadow: 
        inset 0 4px 8px #000000b0,
        0 0 0 2px #a855f7,
        0 8px 18px -10px #a855f780;
      background: #1a132b;
    }

    /* section titles – purple glass */
    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 48px 0 22px;
      padding: 18px 28px;
      border-radius: 40px 12px 40px 12px;
      background: #1e1535e0;
      backdrop-filter: blur(4px);
      box-shadow: 
        0 0 0 1px #7e22ce60,
        0 12px 26px -12px #000000,
        inset 0 1px 0 #ffffff1a;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #d8c2ff;
      letter-spacing: -0.01em;
      border-left: 8px solid #a855f7;
    }

    .section-title.ev {
      border-left-color: #c084fc;
    }

    .section-title.emp {
      border-left-color: #a78bfa;
    }

    /* CARD — hidden answer, click to show purple */
    .card {
      background: #161027;
      border-radius: 28px;
      padding: 26px 28px;
      margin-bottom: 20px;
      box-shadow: 
        0 20px 35px -18px #000000,
        0 0 0 1px #3e2d60,
        inset 0 1px 1px #ffffff0d;
      position: relative;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      border-left: 6px solid #6d28d9;
      animation: cardGlow 0.4s ease;
    }

    .card:hover {
      transform: scale(1.01) translateY(-4px);
      box-shadow: 
        0 30px 45px -15px #000000,
        0 0 0 2px #a855f7a0,
        0 0 28px -8px #a855f7;
      background: #1f1836;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: radial-gradient(circle at 20% 10%, #a855f718, transparent 60%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    /* question number purple chip */
    .q-num {
      display: inline-block;
      background: #2a1b4a;
      color: #c7a7ff;
      padding: 4px 16px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      box-shadow: inset 0 1px 4px #00000080, 0 0 0 1px #7e22ce50;
    }

    .question {
      font-size: 1.22rem;
      font-weight: 600;
      line-height: 1.6;
      color: #f0e7ff;
      margin-bottom: 12px;
      text-shadow: 0 2px 6px #00000060;
      word-break: break-word;
    }

    /* ANSWER — HIDDEN by default, click to reveal in PURPLE */
    .answer {
      background: transparent;
      border: none;
      border-radius: 20px;
      padding: 0;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.6;
      color: transparent;
      text-shadow: none;
      transition: all 0.25s ease;
      user-select: none;
      pointer-events: none;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      margin-top: 0;
      transform: translateY(-6px);
    }

    /* when card is clicked / answer revealed */
    .card.revealed .answer {
      background: #2c1b4e;
      border: 1px solid #b073ff;
      box-shadow: 
        0 0 0 2px #7e22ce60,
        0 10px 20px -12px #a855f7,
        inset 0 1px 8px #00000060;
      color: #e9d5ff;
      padding: 16px 22px;
      opacity: 1;
      max-height: 200px;
      margin-top: 16px;
      transform: translateY(0);
      pointer-events: auto;
      text-shadow: 0 0 8px #c084fc60;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* small hint icon */
    .card .hint {
      display: inline-block;
      margin-left: 12px;
      color: #a78bfa;
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.8;
    }

    .card.revealed .hint {
      display: none;
    }

    /* footer */
    .footer {
      text-align: center;
      margin-top: 65px;
      padding: 28px 20px;
      color: #7e6a9e;
      font-size: 0.9rem;
      border-top: 1px solid #2a1b44;
      letter-spacing: 0.3px;
    }

    .no-results {
      text-align: center;
      padding: 70px 20px;
      background: #130f22;
      border-radius: 48px;
      color: #bba7e6;
      font-size: 1.2rem;
      box-shadow: inset 0 0 0 1px #4c2a80;
    }

    /* animation */
    @keyframes cardGlow {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0a1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #6d28d9;
      border-radius: 20px;
      border: 2px solid #0b0a1a;
    }

    /* mobile */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.8rem; }
      .header p { font-size: 0.85rem; padding: 6px 18px; }
      .set-btn { font-size: 1rem; padding: 14px; min-width: 100%; }
      .question { font-size: 1.08rem; }
      .card { padding: 20px 18px; }
      .section-title { font-size: 1.3rem; padding: 14px 20px; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- header -->
  <div class="header">
    <h1>⚡ ITI  — MCQs</h1>
    
  </div>

  <!-- content dynamic -->
  <div id="content"></div>

  <!-- footer -->
  <div class="footer">

  </div>
</div>

    {q:"Green Mindset के लिए अच्छा अभ्यास क्या है?", a:"करने की क्षमता को अलग से और उसको पुनर्मूल्यांकन करे।", t:"emp"}

  // ======================== ALL SETS ========================
  const allSets = {
    set1: { name: "Set 1", mcqs: set1 },
    set2: { name: "Set 2", mcqs: set2 },
    set3: { name: "Set 3", mcqs: set3 }
  };

  let currentSet = 'set1';
  const contentDiv = document.getElementById('content');
  const searchInput = document.getElementById('search');

  // set selector
  function selectSet(setKey) {
    currentSet = setKey;
    document.querySelectorAll('.set-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('setBtn' + setKey.replace('set', ''));
    if (btn) btn.classList.add('active');
    searchInput.value = '';
    render();
  }

  // RENDER — with hidden answer + click reveal
  function render() {
    const search = searchInput.value.toLowerCase().trim();
    contentDiv.innerHTML = '';

    const setData = allSets[currentSet];
    if (!setData) {
      contentDiv.innerHTML = '<div class="no-results">😕 Set नहीं मिला।</div>';
      return;
    }

    const mcqs = setData.mcqs;

    // EV
    const evQs = mcqs.filter(q => q.t === 'ev' &&
      (q.q.toLowerCase().includes(search) || q.a.toLowerCase().includes(search)));

    if (evQs.length > 0) {
      const title = document.createElement('div');
      title.className = 'section-title ev';
      title.innerHTML = `⚡ ${setData.name} — EV MCQs (${evQs.length})`;
      contentDiv.appendChild(title);

      evQs.forEach(item => {
        const idx = mcqs.indexOf(item) + 1;
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-answer', item.a);
        card.innerHTML = `
          <div class="q-num">Q${idx}</div>
          <div class="question">${item.q} <span class="hint">👆 tap to reveal</span></div>
          <div class="answer">✅ ${item.a}</div>
        `;
        card.addEventListener('click', function(e) {
          // toggle reveal
          this.classList.toggle('revealed');
        });
        contentDiv.appendChild(card);
      });
    }

    // EMP
    const empQs = mcqs.filter(q => q.t === 'emp' &&
      (q.q.toLowerCase().includes(search) || q.a.toLowerCase().includes(search)));

    if (empQs.length > 0) {
      const title = document.createElement('div');
      title.className = 'section-title emp';
      title.innerHTML = `💼 ${setData.name} — Employability MCQs (${empQs.length})`;
      contentDiv.appendChild(title);

      empQs.forEach(item => {
        const idx = mcqs.indexOf(item) + 1;
        const card = document.createElement('div');
        card.className = 'card emp-card';
        card.setAttribute('data-answer', item.a);
        card.innerHTML = `
          <div class="q-num">Q${idx}</div>
          <div class="question">${item.q} <span class="hint">👆 tap to reveal</span></div>
          <div class="answer">✅ ${item.a}</div>
        `;
        card.addEventListener('click', function() {
          this.classList.toggle('revealed');
        });
        contentDiv.appendChild(card);
      });
    }

    if (evQs.length === 0 && empQs.length === 0) {
      contentDiv.innerHTML = '<div class="no-results">😕 कोई परिणाम नहीं मिला। खोज बदलें।</div>';
    }
  }

  // search event
  searchInput.addEventListener('input', render);

  // initial
  selectSet('set1');
</script>
